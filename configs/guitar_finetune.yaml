# Phase 2: fine-tune the pretrained model on a guitar-heavy mix.
#
# Inherits everything from default.yaml and overrides only what actually
# differs. In particular `model.*` is NOT repeated: a fine-tune resumes from a
# checkpoint trained under default.yaml, and a model schedule that drifted out
# of sync would load as an incompatible state dict.
extends: default.yaml

run:
  out_dir: runs/guitar_finetune

data:
  # The index files are deliberately NOT overridden: phase 2 trains on the same
  # corpus as phase 1 and makes it guitar-heavy through mix_weights below. A
  # guitar-only index would contradict those weights -- three of the four would
  # match no entry and silently fall back to 1.0. It would also collide with the
  # per-source index prepare-data writes for the `guitar` source.
  mix_weights:
    slakh: 0.05
    guitar: 0.60
    maestro: 0.10
    private: 0.25

train:
  epochs: 30
  lr: 0.0002        # lower than pretraining: adapt, do not overwrite
  warmup_epochs: 1
  eval_every: 1
