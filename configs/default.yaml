run:
  seed: 1337
  out_dir: runs/default

audio:
  sample_rate: 44100
  decode_channels: 2

features:
  n_mels: 229
  n_fft: 2048
  f_min: 30
  f_max: 16000
  window_frames: 128
  hop_ms: 10
  min_note: 24
  max_note: 95

model:
  channels: [128, 256, 512, 896]   # ~16.5M params (spec target 15-30M)
  n_notes: 128

augment:
  enabled: true
  gain_prob: 0.5
  gain_db: 6.0
  pitch_shift_prob: 0.3
  pitch_shift_steps: 2
  time_stretch_prob: 0.3
  time_stretch: 0.1
  spec_augment_prob: 0.5
  freq_mask_width: 16
  time_mask_width: 24

data:
  index_dir: data/index
  # Dataset roots scanned by `lyre prepare-data`. These are PLACEHOLDERS — point
  # them at real corpora before running it. `private` also accepts a list.
  sources:
    slakh: ~/datasets/slakh2100
    maestro: ~/datasets/maestro-v3.0.0
    guitar: ~/datasets/GuitarSet
    private: ~/datasets/private
  train_index: train.json
  val_index: val.json
  test_index: test.json
  # Keys must match the `source` string prepare-data stamps on each entry
  # (slakh/maestro/guitar/private); an unmatched key silently samples at 1.0.
  # Why this split: see "Training regimen -> Data pipeline" in
  # docs/superpowers/specs/2026-08-04-lyre-music-transcription-design.md.
  mix_weights:
    slakh: 0.40
    guitar: 0.25
    maestro: 0.25
    private: 0.10
  num_workers: 4

train:
  batch_size: 32
  epochs: 60
  lr: 0.001
  weight_decay: 0.0001
  warmup_epochs: 2
  loss_onset_weight: 0.5
  grad_clip: 1.0
  amp: true
  eval_every: 2
  resume: null

tracking:
  p_onset: 0.05
  p_sustain: 0.95
  min_note_sec: 0.06
  merge_gap_sec: 0.03
  min_velocity: 0.2

arrange:
  tempo: 120
  time_signature: [4, 4]
  guitar_tuning: standard
  bass_tuning: standard

labeling:
  use_llm: false

inference:
  window_overlap: 0.5
  chunk_sec: 120        # bounded-memory block length; null/0 disables chunking
  chunk_pad_sec: 2.0    # context padding per block

eval:
  frame_tolerance_frames: 2       # frame/onset F1 tolerance
  note_onset_tolerance_sec: 0.05  # mir_eval onset tolerance
  # "No weak voice" gate: every instrument must reach this frame F1 on its own,
  # so a strong average cannot hide one unusable instrument. An instrument with
  # no eval tracks fails the gate too -- an un-run check is not a passed check.
  # null disables enforcement and reports only. Raise this as the model improves.
  min_instrument_f1: null
