[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyre"
version = "0.1.0"
description = "Audio to multitrack MIDI + guitar/bass/drum tab transcription pipeline"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "numpy",
    "PyYAML",
    "pretty_midi",
    "mir_eval",
    "demucs",
    "PyGuitarPro",
]

[project.optional-dependencies]
# PDF export shells out to the MuseScore CLI (`mscore`/`musescore`), an external
# binary rather than a Python package, so there is no `pdf` extra to install.
# Verovio was dropped: its Python toolkit has no PDF writer.
#
# `lyre export` needs the ONNX toolchain, which the core pipeline does not:
# install it with `pip install lyre[export]`.
export = ["onnx", "onnxscript", "onnxruntime"]
test = ["pytest"]

[project.scripts]
lyre = "lyre.cli.main:main"

[tool.setuptools.packages.find]
include = ["lyre*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
